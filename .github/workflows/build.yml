name: build

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
  schedule:
    - cron: "17 */6 * * *"  # refresh every platform's model list and prices

permissions:
  contents: write

# Every recheck commit triggers a run, often a minute apart. Two runs force-pushing dist at once can fail
# ("cannot lock ref"), and an older run finishing last would publish older data. One run at a time; a newer
# push replaces the waiting run, so the last one built is always the latest commit. Pull requests do not publish.
concurrency:
  group: ${{ github.event_name == 'pull_request' && format('pr-{0}', github.ref) || 'dist' }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - run: pip install pyyaml jsonschema
      - run: python scripts/build.py
      - run: python scripts/build_models.py
      - name: Publish catalog.json to the dist branch
        if: github.event_name != 'pull_request'
        run: |
          cd dist
          git init -q -b dist
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add catalog.json models.json
          git commit -qm "catalog.json from ${GITHUB_SHA::7}"
          git push -qf "https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${GITHUB_REPOSITORY}.git" dist
