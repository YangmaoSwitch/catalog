en:
  summary: Cloud API for the Moondream vision language models; each workspace includes $5 of usage credits per month, usage beyond that is billed per token.
  signup_notes: The terms require users to be at least 18; the exact sign-up requirements are not detailed on official pages.
  tags:
  - Monthly credits
  quotas:
  - models: All cloud models
    note: Per workspace; after the credits are used, usage is billed per token (3.1 real-time $0.30/M input, $1.00/M output); reset time not stated
  - condition: Base tier; 10 requests per second with an account balance of at least $10
  terms:
  - Users must be at least 18
  - Do not exceed rate limits or use the service excessively or abusively
  - Do not resell, rent or host the service for commercial exploitation
  - Customer content and outputs are not used to train generally available models
