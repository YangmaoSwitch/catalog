  - condition: Newly registered accounts
    note: Stated on the homepage; expiry and eligible models are not stated
  terms:
  - One person, one account; automated, scripted, bulk or repeat registration is prohibited (4.1)
  - Accounts created to farm promotional credits are suspended without notice and the bonus reclaimed; the IPs involved may be banned (4.1)
  - Reselling the service without written permission is prohibited (section 4)
  - Request and response content is not stored or used for training (section 7)
