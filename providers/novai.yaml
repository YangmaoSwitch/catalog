en:
  summary: Hong Kong-based gateway to Chinese models. Five models including Zhipu's GLM Flash series are free, 10 calls a day, plus $2 of credit for new users; no credit card or phone number needed.
  signup_notes: Email only; no credit card, deposit or phone number. Every registration goes through automated anti-abuse review, and high-risk sign-ups may be rejected or frozen.
