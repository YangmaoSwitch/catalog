en:
  summary: Unfiltered inference service; after sign-up MythoLite (13B, 2560 context, up to 150 output tokens per reply) is free to call, other models are paid with credits.
  signup_notes: An account is required; the terms say minors may not register.
  tags:
  - Free model
  quotas:
  - models: mytholite
    note: No request or rate limits are published for the free model; the model page lists MythoLite as FREE with 2560 context and a 150-token output cap.
  terms:
  - Unless you have a business account, you may not let others use your account or share your login and API key
  - Inputs may be used to improve the service and train models; you can opt out following the platform's instructions
  - Minors (generally under 18) may not register or use the platform
