en:
  summary: Model aggregation gateway; the few models marked Free in the model list are priced at $0 for input and output and can be called with a pay-as-you-go API key; no usage limits are published for them, and the account balance must not be negative.
  signup_notes: Sign in with email, GitHub or Google. The Free subscription plan works only in the web Studio Chat and has no API access; calling free models through the API uses a pay-as-you-go (PAYG) API key.
  free_model_rule: Follow the Free filter in the official model list; prices are shown as $0 per million input and output tokens; the list changes
  tags:
  - Aggregator
  - Free model
  quotas:
  - models: Models marked Free in the model list
    note: No request or token limit is published for the free models; the GLM 4.7 Flash (Free) page carries a Rate Limit badge without numbers. The error code docs say that to prevent abuse all models (including free tiers) require a non-negative balance; whether a top-up is required before using free models is not stated explicitly
  terms:
  - No frequent or bulk account registration (3.3)
  - Accounts may not be lent, leased, transferred or used by others without consent (3.3)
  - With user authorization, the platform may use input content to provide, maintain, develop and improve the service (6.2)
  - Users must be at least 18 or the age of majority where they live (2.2)
  - To prevent abuse, all models (including free tiers) require a non-negative account balance
