en:
  summary: CoreWeave Forge's free plan provides an OpenAI-compatible Serverless Inference API with a monthly inference allowance (exact amount not published); once used up you must enable pay-as-you-go or upgrade.
  signup_notes: Sign up with email; Serverless Inference is only available from supported geographic locations, other regions get a 403.
  tags:
  - Free model
  - Monthly credits
  quotas:
  - note: The exact amount of the free-tier inference allowance is not published; once used up you must enable pay-as-you-go or upgrade.
  terms:
  - Users must be at least 18 years old
  - Serverless Inference is only available from supported geographic locations, subject to US trade controls and other compliance requirements; other regions get a 403
  - Use must comply with the Acceptable Use Policy (AUP)
