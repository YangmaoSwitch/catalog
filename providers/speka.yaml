en:
  summary: OpenAI-compatible model gateway; sign-up gives a one-time $1 credit with no credit card. The free tier allows 2 requests per minute, 1 key, and only models priced up to $1 per 1M tokens.
  signup_notes: The sign-up page says no card is required; an API key is created automatically after sign-up and shown only once. The sign-up form pre-ticks showing your email in the community feed; you can untick it.
  tags:
  - Aggregator
  - New-user credit
  quotas:
  - models: Live models priced up to $1 per 1M tokens
    note: One-time credit, not refreshed monthly (the lead's "monthly" claim does not match the official site). The site says "every live model priced up to $1 / 1M tokens"; quota_models lists models whose input and output prices are both at most $1, which is this entry's reading.
  - condition: Free tier
  terms:
  - Bypassing rate limits or quotas through key rotation, request flooding or proxy routing is prohibited and may lead to suspension
  - Reselling raw API access is prohibited
  - The provider says it does not store prompt content or use it to train models
  - Some model licenses restrict commercial use (e.g. FLUX.1 [dev]); check the model license yourself
