en:
  summary: Qiniu Cloud's limited-time free model qiniu/conatus-free; after real-name verification you get 100 million tokens free per day, raised to 1 billion per day after a recharge of 100+ CNY, and calls stop when the quota runs out with no charge. The platform also offers the free model Nemotron 3 Ultra Free, and new inference users get a 3-million-token resource pack.
  signup_notes: You must sign in to a Qiniu Cloud account and complete real-name verification to call the model for free; new registrants also get up to 20 million tokens.
  tags:
  - Limited-time free
  - Free model
  - New-user gift
  quotas:
  - models: qiniu/conatus-free
    condition: Real-name verified users
    note: All API keys under one account share the quota; resets daily at 00:00 Beijing time, unused quota does not carry over; calls stop after the activity ends. The activity page now says the activity runs until 2026-12-31 23:59, but the model page and model square still say 11-30; ends uses the conservative date.
  - models: qiniu/conatus-free
    condition: Real-name verified with any single recharge over 100 CNY (multiple recharges do not accumulate)
    note: Raising the quota via recharge is not paid continuation; when the quota is exhausted requests are rejected and no balance, resource pack, subscription or points are deducted.
  - models: nvidia/nemotron-3-ultra-550b-a55b0-free
    note: Quota not published; free but stability is not guaranteed, do not use in production.
  - condition: New inference users (accounts that have never used the inference service)
    note: Issued automatically after usage is first billed (about 1 hour delay), deducted proportionally across all models; after the pack runs out, usage is billed pay-as-you-go.
  terms:
  - Do not run programs or processes unrelated to the purchased service that heavily consume Qiniu Cloud resources (3.1.3.6)
  - Qiniu Cloud may freeze the account, restrict or terminate service for violating the agreement (8.1)
  - Use of AI services must comply with data and content compliance commitments; do not transmit personal information or important data abroad (3.1.11)
  - Some services require real-name verification; refusing it means the service cannot be used (7.1)
