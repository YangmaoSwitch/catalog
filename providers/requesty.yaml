en:
  summary: Aggregator gateway; the free plan can call the listed free models, 200 requests per organization per day, no credit card needed.
  signup_notes: Free models need no credit card; the platform may ask for email, phone or identity verification to prevent abuse.
  tags:
  - Aggregator
  - Free model
  quotas:
  - models: All free models combined
    condition: New (unpaid) organizations
  - models: All free models combined
    condition: New (unpaid) organizations
  - models: All free models combined
    condition: Paying organizations (also 60 per minute)
  terms:
  - One account per individual or legal entity; multiple accounts to get around usage limits are prohibited (3.1)
  - Creating accounts or abusing offers by automated means is prohibited (10)
  - On the free plan, inputs and outputs sent to models labelled Training Permitted may be used for training (5.9, 6.2(a))
  - Use from jurisdictions under comprehensive UK, EU or US sanctions is prohibited (9.2)
  - The free models are free for now; price changes will be announced in the changelog in advance
