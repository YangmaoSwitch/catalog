terms:
- point: 每人或每个法人只能有一个账号，禁止注册多个账号绕过用量限制（3.1）
  url: https://www.requesty.ai/terms
- point: 禁止用自动化手段注册账号或滥用优惠（10）
  url: https://www.requesty.ai/terms
- point: 免费计划调用标为 Training Permitted 的模型时，输入输出可被用于训练（5.9、6.2(a)）
  url: https://www.requesty.ai/terms
- point: 禁止在受英国、欧盟、美国全面制裁的地区使用（9.2）
  url: https://www.requesty.ai/terms
- point: 免费模型目前免费，价格变动会提前在更新日志公告
