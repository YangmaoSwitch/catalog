en:
  summary: Model aggregator API; free accounts need no credit card and can call a few models marked free, with a monthly free-model request quota whose size is not published; other models are pay as you go.
  signup_notes: The sign-up page says it is free to start with no card needed; paid models require a card and credits.
  free_model_rule: Models whose names end in (free) and are priced $0 / $0 are free, e.g. Nemotron 3.5 Lightning (free), Nemotron 3 Ultra (free), Flint (free), Ling 3.2 Flash (free), LFM3-1.7B (free), ERNIE-5.5-Flash-Preview (free), Particle-1 (free); exact model IDs are listed by /api/v1/models with a key.
  tags:
  - Aggregator
  - Free model
  - Monthly credit
  quotas:
  - models: All models marked free combined
    note: The docs mention a monthly free-model quota but do not publish the number. The Terms of Service say access requires a paid monthly plan, which conflicts with the free start on the pricing and sign-up pages, so this is kept as unconfirmed.
  - models: Recursive Flint (free)
    note: The model page lists $0 / $0 and says it is free within plan limits; the limit is not published.
  terms:
  - The Terms of Service (updated 2026-08-24) say access requires a paid monthly plan, which conflicts with the free plan on the pricing page.
  - Paid plans include weekly usage; usage beyond it draws from prepaid credits, with optional auto-refill.
  - All keys on an account share its balance and limits; do not put keys in public websites or mobile apps.
