id: nvidia-nim
name: NVIDIA NIM (build.nvidia.com)
homepage: https://build.nvidia.com
region: global
api_usable: true
status: verified
last_verified: '2026-11-25'
summary: build.nvidia.com 上的模型可免费用于原型开发，按速率限制计算，大多数模型每分钟最多 40 次请求，不按 token 计费。
api:
  protocol:
  - openai
  base_url: https://integrate.api.nvidia.com/v1
  models_url: https://integrate.api.nvidia.com/v1/models
  modelsdev: nvidia
  models_access: free
signup:
  url: https://build.nvidia.com
  requires:
  - email
quotas:
- unit: credits
  amount: null
  period: one-time
  scope: account
  evidence: https://docs.api.nvidia.com/nim/docs/faq
  quote: Remote API calls to NVIDIA-hosted endpoints count against trail API credits.
  note: 旧版文档提到试用额度，官方未公布数值；build.nvidia.com 的 FAQ 现写明免费档按速率限制、不按 token 计费。
- unit: requests
  amount: 40
  period: minute
  scope: account
  models: 大多数模型
  condition: 仅限原型开发；个人速率限制以控制台右上角显示为准
  evidence: https://build.nvidia.com/faq
  quote: The free tier runs on rate limits - up to 40 requests per minute (RPM) for most models, with no per-token billing.
overage: blocked
onboarding:
  level: L1
  key_page: https://build.nvidia.com
  key_pattern: ^nvapi-
tags:
- 免费模型
- 试用
en:
  summary: Models on build.nvidia.com are free for prototyping under rate limits, up to 40 requests per minute for most models, with no per-token billing.
  tags:
  - Free models
  - Trial
  quotas:
  - note: Older docs mention trial credits with no published amount; the build.nvidia.com FAQ now says the free tier runs on rate limits with no per-token billing.
  - models: Most models
    condition: Prototyping only; your personal rate limit is shown in the top-right of the dashboard
