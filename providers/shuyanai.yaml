en:
  summary: Chinese LLM API aggregator; signing up and binding a phone number gives a one-time free credit of 500,000 tokens, after which you top up and pay per use.
  signup_notes: Sign up with phone or email, or log in with WeChat; a bound phone number is required to claim the free credit.
  tags:
  - Aggregator
  - New-user credits
  quotas:
  - condition: Sign up and bind a phone number
    note: The pricing page says 500,000 tokens while the homepage says new users get 5M tokens; the smaller figure is used. Eligible models and expiry are not stated. Inviting a user gives another 500,000 tokens.
  terms:
  - No malicious registration, including frequent or bulk sign-ups
  - Accounts, membership benefits and API keys may not be rented, lent, transferred, sold or shared
  - No automation, bulk registration, scripts, proxy pools or abusive concurrency; reselling or sharing the API or credits needs written authorization
  - The platform may limit rate, concurrency, quota and model types based on load, plan or risk, and may change quota rules and prices
