  base_url: https://bedrock-runtime.us-east-1.amazonaws.com/openai/v1
  models_access: quota
signup:
  url: https://signin.aws.amazon.com/signup?request_type=builderId
  requires:
  - email
  notes: 大多数新客户注册不需要支付方式，个别情况可能要求提供支付方式验证身份。只有从未有过 AWS 账号的新客户才可领取。Bedrock API Key 需在控制台 Bedrock 页面的 API keys 中生成（长期 Key 会创建 IAM 用户），地址按区域区分。
quotas:
- unit: usd
  amount: 100
  period: one-time
  scope: account
  new_users: true
  condition: 新 AWS 客户注册（Free plan 或 Paid plan 均可）
  note: 额度通用于参与的 AWS 服务，Bedrock 在 Free plan 可用服务之列；FAQ 写额度 6 个月后过期，条款页写 12 个月，按 6 个月理解；Free plan 在 6 个月或额度用完时结束，账号随之关闭
  evidence: https://aws.amazon.com/free/
  quote: When you create a new AWS Free Tier account, you get $100 in credits immediately.
- unit: usd
  amount: 100
  period: one-time
  scope: account
  new_users: true
  condition: 在控制台 Explore AWS 中完成指定活动，最多再得 100 美元
  evidence: https://aws.amazon.com/free/
  quote: As you explore key services, you can earn up to $100 more.
overage: blocked
onboarding:
  level: L2
