- point: 同一人不能为多个账号领取 Free Tier 额度，已有或曾有 AWS 账号的不符合条件
  url: https://aws.amazon.com/free/terms/
- point: Free plan 账号仅供评估，不应处理敏感数据
  url: https://aws.amazon.com/free/terms/
