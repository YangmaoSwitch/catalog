en:
  summary: New AWS customers get $100 in credits at sign-up and can earn up to $100 more through set activities, usable for model calls on Amazon Bedrock; the Free plan lasts up to 6 months and the account closes when credits run out or the period ends, with no charges during it.
  signup_notes: Most new customers need no payment method to sign up, though one may be requested to verify identity. Only customers who have never had an AWS account qualify. Bedrock API keys are generated under API keys in the Bedrock console (a long-term key creates an IAM user); endpoints are per region.
  tags:
  - New-user credits
  - Trial
  quotas:
  - condition: New AWS customers (Free plan or Paid plan)
    note: Credits apply across participating AWS services, and Bedrock is available on the Free plan; the FAQ says credits expire after 6 months while the terms say 12 months, read as 6 months; the Free plan ends after 6 months or when credits run out, and the account closes
  - condition: Complete set activities in Explore AWS in the console for up to $100 more
  terms:
  - Free Tier credits cannot be received for more than one account; people who have or had an AWS account are not eligible
  - Free plan accounts are for evaluation and should not process sensitive data
  - After the Free plan ends the account is suspended and is deleted with its data if not upgraded within 90 days
  - AWS may terminate any offer on the Free Tier page at any time
  - Free Tier credits do not apply in the China (Ningxia, Beijing) and GovCloud regions
  - After upgrading to the Paid plan, usage beyond the credits is billed at standard rates automatically
