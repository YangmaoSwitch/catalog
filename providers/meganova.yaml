id: meganova
name: MegaNova AI
homepage: https://www.meganova.ai
region: global
api_usable: true
status: verified
last_verified: '2026-11-22'
summary: 以角色扮演模型见长的推理平台，免费注册的 Tier 1 账号每天可免费调用 Manta Mini、Manta Flash、Mistral Small 等 8 个文本模型各 50 次，UTC 零点重置，无需信用卡。
api:
  protocol:
  - openai
  base_url: https://api.meganova.ai/v1
  models_url: https://api.meganova.ai/v1/models
  models_access: paid
  free_models:
  - meganova-ai/manta-mini-1.0
  - meganova-ai/manta-flash-1.0
  - mistralai/Mistral-Small-3.2-24B-Instruct-2506
  - Steelskull/L3.3-MS-Nevoria-70b
  - Sao10K/L3-70B-Euryale-v2.1
  - Sao10K/L3-8B-Stheno-v3.2
  - BruhzWater/Sapphira-L3.3-70b-0.1
  - FallenMerick/MN-Violet-Lotus-12B
  free_model_rule: Tier 1 可用的免费模型；充值 1 美元升到 Tier 2 后额度提高，并加入 Manta Pro 和 GLM-4.7-Flash
signup:
  url: https://www.meganova.ai/register
  requires:
  - email
  notes: Tier 1 免费注册，不需要信用卡；只在官方支持的国家和地区提供服务，用 VPN 或代理从不支持的地区访问属违规。
quotas:
- unit: requests
  amount: 50
