- point: 提交的内容授予平台广泛的使用许可，角色和对话生成内容可被平台使用、出售和授权
  url: https://docs.meganova.ai/legal-docs/terms-of-service.md
- point: 不得用自动化手段从服务抓取数据，被封禁后不得设法绕过
  url: https://docs.meganova.ai/legal-docs/terms-of-service.md
- point: 只在支持的国家和地区提供服务，用 VPN、代理从不支持的地区访问可能导致封号
  url: https://docs.meganova.ai/faq/supported-countries.md
