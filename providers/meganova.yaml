  reset: 00:00 UTC
  scope: model
  models: 每个免费文本模型各 50 次
  condition: Tier 1（免费注册）
  note: 按账号、按模型计；用完后默认停止，只有在账号里打开“免费额度用完后允许付费”才会转为扣余额
  evidence: https://docs.meganova.ai/free-model-quota.md
- unit: requests
  amount: 500
  period: day
  reset: 00:00 UTC
  scope: model
  models: Manta Mini、Manta Flash、Stheno、Violet-Lotus 各 500 次；Mistral Small、Nevoria、Euryale、Sapphira 各 300 次；Manta Pro 和 GLM-4.7-Flash 各 50 次
  condition: Tier 2（充值 1 美元解锁）
  evidence: https://docs.meganova.ai/free-model-quota.md
- unit: requests
  amount: 60
  period: minute
  scope: account
  condition: Tier 1，另限每分钟 20 万 token
  evidence: https://docs.meganova.ai/tiers/tier-1.md
overage: blocked
expires: null
onboarding:
