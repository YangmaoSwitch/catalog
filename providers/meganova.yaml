en:
  summary: Inference platform known for role-play models. Free Tier 1 accounts can call 8 text models, including Manta Mini, Manta Flash and Mistral Small, 50 times each per day for free, reset at 00:00 UTC, no credit card needed.
  signup_notes: Tier 1 sign-up is free and needs no credit card; service is limited to the officially supported countries and regions, and using a VPN or proxy from an unsupported region breaks the terms.
  free_model_rule: Free models available on Tier 1; a $1 deposit moves you to Tier 2 with higher quotas plus Manta Pro and GLM-4.7-Flash
  tags:
  - Always free
  - Free model
  - Daily credits
  quotas:
  - models: 50 for each free text model
    condition: Tier 1 (free sign-up)
    note: Counted per account and per model; usage stops once used up unless you turn on "Allow paid usage after free quota", which then charges your balance
  - models: 500 each for Manta Mini, Manta Flash, Stheno and Violet-Lotus; 300 each for Mistral Small, Nevoria, Euryale and Sapphira; 50 each for Manta Pro and GLM-4.7-Flash
    condition: Tier 2 (unlocked by a $1 deposit)
  - condition: Tier 1, also 200K tokens per minute
  terms:
  - Free modules are for evaluation and interactive use only, not production or unattended batch work; high-throughput use leads to suspension
  - Submitted content is licensed broadly to the platform, and characters and generated chats may be used, sold and licensed by it
  - No automated data gathering from the service, and no getting around a block
  - Service is limited to supported countries and regions; access via VPN or proxy from unsupported regions may get the account suspended
  - The models with free quota may change with capacity and usage
