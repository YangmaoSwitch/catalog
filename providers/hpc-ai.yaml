en:
  summary: Model API service from a Singapore GPU cloud; the page has a "Start Free Trial" button and the docs say signing up and topping up earn vouchers, but no amount is given.
  signup_notes: Sign up with email (email verification required) or a Google account.
  tags:
  - Trial
  quotas:
  - condition: New accounts
    note: The quickstart says you "sign up, top up, and receive vouchers" and points to the home page for amounts, which does not state them; the Model APIs free-trial FAQ is collapsed and could not be read
  terms:
  - Billing uses vouchers first (earliest expiry first), then monthly credits, then balance; balance cannot be withdrawn
