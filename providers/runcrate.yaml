id: runcrate
name: Runcrate
homepage: https://www.runcrate.ai
region: global
api_usable: true
status: verified
last_verified: '2026-11-22'
summary: GPU 云和推理平台，用 GitHub 登录即可每周免费调用 5 个开源模型，额度每周一重置；绑卡账号超出部分会自动扣费。
api:
  protocol:
  - openai
  - anthropic
  base_url: https://api.runcrate.ai/v1
  anthropic_base_url: https://api.runcrate.ai
  models_url: https://api.runcrate.ai/v1/models
  models_access: paid
  free_models:
  - deepseek-ai/DeepSeek-V4.1-Flash
  - zai-org/GLM-5.3-Flash
  - zai-org/GLM-5.3
  - openai/gpt-oss-120b
  - Qwen/Qwen3.8-Flash
signup:
  url: https://www.runcrate.ai/auth/signup
  requires:
  - github
  min_age: 18
  notes: 用注册满 30 天的 GitHub 账号登录无需信用卡，每个 GitHub 账号一份免费额度；用 Google 注册须绑定信用卡或借记卡（不收预付卡），每张卡一份免费额度
quotas:
- unit: tokens
  amount: null
  period: week
  reset: 每周一（时区未写明）
  scope: org
  models: 5 个免费模型合计
  note: 官方未公布具体数值，用量与重置时间在 API Key 页面显示；提示词、缓存 token 和回复都计入，工作区内所有 Key 和成员共用
  evidence: https://www.runcrate.ai/inference/free
overage: auto_paid
expires: null
onboarding:
  level: L2
  key_page: https://www.runcrate.ai/dashboard/api-keys
  key_pattern: ^rc_live_
terms:
- point: 用 Google 注册并绑卡的账号，免费额度用完后会自动充值扣卡继续使用；无余额的账号则停用到重置（错误码 free_allowance_used）
  url: https://www.runcrate.ai/inference/free
- point: 免费请求由第三方模型提供方处理，提示词和输出受其条款约束
  url: https://www.runcrate.ai/inference/free
- point: 禁止在受美国全面制裁的国家和地区使用（古巴、伊朗、朝鲜、叙利亚、俄罗斯、白俄罗斯及乌克兰部分地区）（第 9 条）
  url: https://www.runcrate.ai/terms
tags:
- 免费模型
sources:
- https://www.runcrate.ai/inference/free
- https://www.runcrate.ai/llms.txt
- https://runcrate.ai/agents.md?model=deepseek-ai%2FDeepSeek-V4.1-Flash&intent=agent
- https://www.runcrate.ai/terms
en:
  summary: GPU cloud and inference platform; signing in with GitHub gives a weekly free allowance on 5 open models, reset every Monday; accounts with a card are charged automatically beyond it.
  signup_notes: Signing in with a GitHub account at least 30 days old needs no credit card, one allowance per GitHub account; Google sign-ups need a credit or debit card on file (no prepaid cards), one allowance per card
  tags:
  - Free model
  quotas:
  - models: The 5 free models combined
    note: The amount is not published; usage and reset time are shown on the API keys page. Prompt, cached tokens and reply all count, shared by every key and member of the workspace
  terms:
  - For Google sign-ups with a card, usage beyond the free allowance is charged to the card by automatic top-up; accounts without credit stop until reset (error free_allowance_used)
  - Free requests are served by third-party model providers whose terms apply to prompts and outputs
  - Use from countries and regions under comprehensive US sanctions (Cuba, Iran, North Korea, Syria, Russia, Belarus and parts of Ukraine) is prohibited (section 9)
