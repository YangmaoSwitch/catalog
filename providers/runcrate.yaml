  scope: org
  models: 5 个免费模型合计
  note: 官方未公布具体数值，用量与重置时间在 API Key 页面显示；提示词、缓存 token 和回复都计入，工作区内所有 Key 和成员共用
  evidence: https://www.runcrate.ai/inference/free
  quote: Free usage is counted by the week, which resets every Monday.
overage: blocked
expires: null
