en:
  summary: GPU cloud and inference platform; signing in with GitHub gives a weekly free allowance on 5 open models, reset every Monday; requests stop when it is used up, and only switch to your balance if you turn on Extra usage.
  signup_notes: Signing in with a GitHub account at least 30 days old needs no credit card, one allowance per GitHub account; Google sign-ups need a credit or debit card on file (no prepaid cards), one allowance per card
  tags:
  - Free model
  quotas:
  - models: The 5 free models combined
    note: The amount is not published; usage and reset time are shown on the API keys page. Prompt, cached tokens and reply all count, shared by every key and member of the workspace
  terms:
  - Past the free allowance, requests stop until it resets (free_allowance_used); turning on Extra usage in the dashboard bills your balance instead, at half the list price on shared capacity and the list price when it is busy
  - When free capacity is busy, the answer is an overload error (overloaded) with a short Retry-After
  - Free requests are served by third-party model providers whose terms apply to prompts and outputs
  - Use from countries and regions under comprehensive US sanctions (Cuba, Iran, North Korea, Syria, Russia, Belarus and parts of Ukraine) is prohibited (section 9)
