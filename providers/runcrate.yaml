terms:
- point: 免费额度用完后请求停止到重置（错误码 free_allowance_used）；在控制台开启 Extra usage 后改从余额扣费，共享算力按标价一半，繁忙时按标价
  url: https://www.runcrate.ai/inference/free
- point: 免费算力繁忙时返回过载错误（overloaded）并带较短的 Retry-After
  url: https://www.runcrate.ai/inference/free
- point: 免费请求由第三方模型提供方处理，提示词和输出受其条款约束
  url: https://www.runcrate.ai/inference/free
- point: 禁止在受美国全面制裁的国家和地区使用（古巴、伊朗、朝鲜、叙利亚、俄罗斯、白俄罗斯及乌克兰部分地区）（第 9 条）
  url: https://www.runcrate.ai/terms
tags:
- 免费模型
sources:
- https://www.runcrate.ai/inference/free
- https://www.runcrate.ai/llms.txt
