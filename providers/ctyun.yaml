en:
  summary: China Telecom eSurfing Cloud's TokenHub gives some models a free trial quota that varies by model and lasts 2 weeks; the homepage also advertises 500,000 free tokens. After identity verification it can be called through an OpenAI-compatible API, and usage switches to pay-as-you-go by default once the free quota runs out.
  signup_notes: Personal or company identity verification is required; the main account must enable the service under Online Inference and create a service group under APP Key management to get an App Key
  tags:
  - Trial
  quotas:
  - note: The homepage promotion says 500,000 tokens can be claimed for free; applicable models, validity and conditions are not stated
  - models: Some models (see the "start free trial" dialog in the console)
    note: The free quota differs per model and the docs do not publish the amounts; shared by main and sub-accounts; cannot be used at the same time as a purchased token pack; after it runs out or expires, usage is billed pay-as-you-go unless auto-stop was ticked
  terms:
  - The free trial quota is shared by the main account and sub-accounts and cannot be allocated to sub-accounts
  - The provider asks you to keep the App Key safe and not share it publicly
  - When the free quota runs out, billing switches to pay-as-you-go; tick "stop the service automatically when the free quota is used up or expires" to avoid charges
