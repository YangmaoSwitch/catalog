id: clod
name: CLōD
homepage: https://clod.io
region: global
api_usable: true
status: verified
last_verified: '2026-11-28'
summary: OpenAI 兼容的模型网关，首次充值任意金额后，每天可免费调用 3 个开源模型 50 次请求、共 20 万 tokens；新用户充值另有 50% 赠送，最多 25 美元。
api:
  protocol:
  - openai
  base_url: https://api.clod.io/v1
  models_access: paid
  free_models:
  - clod/trinity-mini
  - clod/gemma-4-31b-it
  - clod/qwen3p5-9b
  free_model_rule: 价格页列出的免费模型：Trinity Mini、Qwen 3.5 9B 和 Gemma 4。
signup:
  url: https://app.clod.io/auth
  requires:
  - email
  - card
  notes: 可用邮箱、Google 或 Microsoft 账号注册；每日免费用量需先充值一次（金额不限）才会开启。隐私政策写明服务不面向 16 岁以下用户。
quotas:
- unit: requests
  amount: 50
  period: day
  scope: account
  models: 免费模型
  condition: 首次充值任意金额后开启
  evidence: https://clod.io/pricing
  quote: 50 requests and 200,000 tokens per day
  note: 单次请求最多 8,000 输入 tokens、2,000 输出 tokens；重置时间未写明。官方称免费请求不会扣费，达到上限会直接报错。
- unit: requests
  amount: 1000
  period: day
  scope: account
  models: 免费模型
  condition: 累计消费 25 美元后
  evidence: https://clod.io/pricing
  quote: It turns on with your first credit top-up, any amount.
  note: 价格页已不再提供“消费 25 美元后每天 1,000 次”这一档，现为首次充值后每天 50 次。
  ended: '2026-11-26'
- unit: tokens
  amount: 200000
  period: day
  scope: account
  models: 免费模型
  condition: 首次充值任意金额后开启
  evidence: https://clod.io/pricing
  quote: 50 requests and 200,000 tokens per day
  note: 与每天 50 次请求的限制同时生效。
- unit: usd
  amount: 25
  period: one-time
  scope: account
  models: 全部模型（账户余额通用）
  condition: 新用户充值后按充值金额 50% 赠送，最多 25 美元
  evidence: https://clod.io/pricing
  quote: New users, up to $25 free
  new_users: true
  note: 价格页横幅写明“50% Credit Match”，无需兑换码，24 小时内到账。需先自行充值才有赠送，未写明截止日期和赠送额度的有效期。
overage: blocked
onboarding:
  level: L2
  key_page: https://app.clod.io
terms:
- point: 隐私政策写明不会用用户的输入和输出训练或改进模型
  url: https://clod.io/privacy
- point: 服务不面向 16 岁以下用户
  url: https://clod.io/privacy
- point: 请求会按电价路由到不同数据中心处理，可能位于美国等其他地区
  url: https://clod.io/privacy
tags:
- 免费模型
- 每日赠送
- 新人赠送
sources:
- https://clod.io/pricing
- https://clod.io
