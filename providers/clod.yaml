en:
  summary: OpenAI-compatible model gateway. After a first top-up of any amount, you get 50 free requests and 200,000 tokens per day on 3 open-source models. New users also get a 50% match on top-ups, up to $25.
  signup_notes: Sign up with email, Google or Microsoft. Daily free usage only turns on after your first credit top-up (any amount). The privacy policy says the service is not meant for anyone under 16.
  free_model_rule: 'Free models listed on the pricing page: Trinity Mini, Qwen 3.5 9B and Gemma 4.'
  tags:
  - Free model
  - Daily credits
  - New-user credits
  quotas:
  - models: Free models
    condition: Turns on after the first top-up of any amount
    note: Each request is capped at 8,000 input and 2,000 output tokens. Reset time is not stated. The site says free requests are never charged and you get an error at the limit.
  - models: Free models
    condition: After a $25 purchase
    note: The pricing page no longer offers the 1,000 requests/day tier after $25 spent. It now gives 50 requests/day after the first top-up.
  - models: Free models
    condition: Turns on after the first top-up of any amount
    note: Applies together with the 50 requests/day limit.
  - models: All models (shared account balance)
    condition: New users get 50% of their top-up added as bonus credit, up to $25
    note: The pricing page banner says "50% Credit Match". No code is needed and the credit is added within 24 hours. You have to top up first to get it. No end date or credit expiry is stated.
  terms:
  - The privacy policy says inputs and outputs are not used to train or improve AI models
  - The service is not meant for anyone under 16
  - Requests are routed by energy price to data centers that may be in other jurisdictions, including the US
