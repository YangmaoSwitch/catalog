en:
  summary: Indian prepaid model API platform; the Free plan gives 50 credits on signup and 50 more on the 1st of every month (1 credit = ₹1), usable only on GPT OSS 20B, at 5 requests per minute and 500 per day.
  signup_notes: Sign up with email or Google, no card needed. A first recharge of ₹500 or more moves you to the Developer plan with more models.
  tags:
  - Monthly credits
  - New-user credits
  quotas:
  - note: Signup bonus; 1 credit = ₹1, billed per token (gpt-oss-20b ₹0.01 per 1K input, ₹0.03 per 1K output tokens); the terms say free credits may expire or be withdrawn
  - condition: Free-plan accounts
    note: 1 credit = ₹1; the terms say free credits may expire or be withdrawn
  - condition: Free plan
    note: Shared by all API keys; the Free plan allows only 1 key
  - condition: Free plan
  terms:
  - Free credits have no cash value and may expire or be withdrawn (section 6)
  - Bypassing rate limits, balance checks or other technical controls is prohibited (section 5)
  - Reselling or exposing the service to third parties in competition with nabh.cloud is prohibited (section 5)
  - Users must be at least 18 (section 3)
  - Prompts and completions are used only to serve requests, bill and prevent abuse, never for training
