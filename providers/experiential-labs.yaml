  notes: 免费模型需绑卡验证，会临时扣 1 美元并退回，不计入余额；免费计划没有月度通用额度
quotas:
- unit: tokens
  amount: 1000000
  period: day
  reset: 00:00 UTC
  scope: account
  models: gpt-6-luna、deepseek-v4.1-flash 和 Clef 决策接口合计
  note: 输入和输出 token 合计；超出返回 429
  evidence: https://www.experientiallabs.ai/pricing
- unit: requests
  amount: 10
  period: minute
  scope: account
  models: 免费核心模型合计
  evidence: https://www.experientiallabs.ai/pricing
- unit: tokens
  amount: 250000
  period: minute
  scope: account
  models: 免费核心模型合计
  evidence: https://www.experientiallabs.ai/pricing
overage: blocked
expires: null
onboarding:
  level: L2
  key_page: https://platform.experientiallabs.ai/api-keys
terms:
- point: 免费计划下账号提交的全部请求和输出都会纳入数据授权计划，去标识化后可出售给第三方用于训练模型，免费计划不能关闭（7.4、7.5）
  url: https://www.experientiallabs.ai/terms
- point: 免费计划默认保存请求和响应内容（1.7）
  url: https://www.experientiallabs.ai/terms
- point: 禁止使用多个账号绕过用量限制、费用或处罚（第 3 条）
  url: https://www.experientiallabs.ai/terms
- point: 禁止用 VPN、代理或虚假地区信息绕过地区限制（4.2.1）
  url: https://www.experientiallabs.ai/terms
- point: 余额充值默认需手动发起，自动充值需用户自行开启（5.2）
  url: https://www.experientiallabs.ai/terms
tags:
