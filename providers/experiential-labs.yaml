en:
  summary: Hosted service of an open-source AI gateway; the free plan allows 1M tokens a day on GPT-6 Luna and DeepSeek V4.1 Flash, reset at 00:00 UTC, after card verification.
  signup_notes: Free models require card verification with a temporary $1 charge that is refunded and not added to the balance; the free plan has no general monthly credits
  tags:
  - Daily credits
  - Free model
  - Aggregator
  quotas:
  - models: gpt-6-luna, deepseek-v4.1-flash and the Clef decision endpoint combined
    note: Input and output tokens combined; 429 when exceeded
  - models: Free core models combined
  - models: Free core models combined
  terms:
  - On the free plan all requests and outputs of the account join the Data Licensing Program and may be sold to third parties for model training after de-identification; this cannot be turned off on the free plan (7.4, 7.5)
  - Request and response content is stored by default on the free plan (1.7)
  - Using multiple accounts to get around usage limits, fees or enforcement is prohibited (section 3)
  - Using VPNs, proxies or false location information to get around geographic restrictions is prohibited (4.2.1)
  - Credit top-ups are manual by default; automatic top-up must be turned on by the user (5.2)
