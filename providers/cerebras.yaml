en:
  summary: New accounts get a one-time $5 trial credit, valid for 30 days, after adding a verified payment method; there is no permanent free tier.
  signup_notes: A verified payment method is required before the trial credit is granted and the Playground and API are enabled; adding it costs nothing and does not enroll you in paid usage.
  tags:
  - New users
  - Trial
  quotas:
  - condition: Add a verified payment method
    note: Usable on all public models; buy credits to continue once it is used up or expires
  - models: gpt-oss-120b
    note: The trial also limits it to 5 requests per minute and 1M tokens per hour
  - models: qwen-3.8-27b
    note: No hourly or daily token caps; same rate limits as the paid tier
  terms:
  - Trial credits are non-transferable, have no cash value, and may be withheld or revoked for fraud, abuse or duplicate accounts
  - There is no permanent free tier; API access pauses when credits run out or expire until you buy credits
