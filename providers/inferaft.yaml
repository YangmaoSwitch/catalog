en:
  summary: Open-model inference service for coding agents run by a Korean company; the first 300 new accounts get 3M GLM 5.3 Flash tokens, and inviting a friend gives both of you 3M more.
  signup_notes: You must verify your email before creating an API key; paid plans are card subscriptions through Paddle.
  tags:
  - New users
  quotas:
  - models: glm-5.3-flash
    condition: First 300 new accounts (250 left on the home page on 2026-11-22)
    note: No expiry is stated; the terms say free preview access ends at the time shown in your console
  - models: glm-5.3-flash
    condition: Invite a friend to sign up; both of you get it
  terms:
  - One account per person; do not bypass shared limits
  - Do not open extra API keys to get around limits; all keys share the workspace concurrency cap
  - Free preview access ends at the time shown in your console; all purchases are final
  - Only request metadata and token counts are stored, not prompt or completion bodies
