id: amd-radeon-cloud
name: AMD Radeon Cloud Token Factory
homepage: https://developer.amd.com.cn/radeon/tokenfactory
region: cn
api_usable: true
status: verified
last_verified: '2026-11-28'
summary: 每天赠送积分，所有模型共用；新用户注册后 14 天内每天 5 积分。
api:
  protocol:
  - openai
  - anthropic
  base_url: https://developer.amd.com.cn/radeon/api/v1
  modelsdev: amd
  models_access: quota
  anthropic_base_url: https://developer.amd.com.cn/radeon/api
signup:
  url: https://developer.amd.com.cn/login
  requires:
  - email
  - phone
quotas:
- unit: points
  amount: 1
  period: day
  scope: account
  evidence: https://amd-aim.github.io/radeon-cloud-docs/api/rate-limits/
  reset: 00:00 Asia/Shanghai
  quote: Counted in Token Factory points (pts) over the calendar day in Beijing time; resets at 00:00 UTC+8
- unit: points
  amount: 5
  period: day
  scope: account
  evidence: https://amd-aim.github.io/radeon-cloud-docs/api/rate-limits/
  reset: 00:00 Asia/Shanghai
  condition: 注册 14 天内
  new_users: true
  quote: Counted in Token Factory points (pts) over the calendar day in Beijing time; resets at 00:00 UTC+8
overage: blocked
onboarding:
  level: L1
  key_page: https://developer.amd.com.cn/radeon/tokenfactory
tags:
- 每日赠送
en:
  summary: Daily credits shared by all models; new users get 5 credits a day for the first 14 days.
  tags:
  - Daily credits
  quotas:
  - {}
  - condition: Within 14 days of signing up
