en:
  summary: Model gateway on the decentralized Gonka GPU network. New accounts get 1M free tokens, no credit card needed.
  signup_notes: Sign in with email or Google; new accounts receive the free tokens automatically, no credit card needed.
  tags:
  - New users
  quotas:
  - models: All models
    condition: New accounts
    note: Free tokens are spent before any paid balance; no expiry is stated
