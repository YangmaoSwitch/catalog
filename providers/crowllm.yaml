en:
  summary: Aggregator gateway; models on its zero-price "free shelf" cost nothing and need no card. Free calls have a per-minute ceiling (number not published); the site only states that plans keep the free shelf open at a zero balance.
  free_model_rule: Models priced at zero for both input and output and open to the free group in the official price list (/api/pricing); a ":free" suffix alone does not mean free
  signup_notes: No credit card; sign in with GitHub, Google or Discord, no email/password registration
  tags:
  - Aggregator
  - Free model
  quotas:
  - models: Free-shelf models (zero price)
    condition: Accounts without a plan; a plan lifts the per-minute ceiling and keeps the free shelf open at a zero balance
  terms:
  - Free-shelf models stay at zero price, with no card and no trial timer
  - Calls that return no answer are refunded, not billed
