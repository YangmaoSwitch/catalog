en:
  summary: Agnes's own Flash text, image and video models are currently billed at $0; free users are limited by requests per minute.
  signup_notes: Google or GitHub sign-in also works; not available in sanctioned jurisdictions
  free_model_rule: Models whose “Angel User Trial Price” is $0 on the pricing page; promotion end dates follow platform announcements, and agnes-2.5-flash retires on 2026-11-30
  tags:
  - Free model
  - Limited-time free
  quotas:
  - models: agnes-3.0-flash and other Flash models
    note: Free users are limited by requests per minute; the number is not published, and extra keys of the same type do not add up. See the pricing page for the $0 prices
  terms:
  - Free keys and Token Plan keys have separate limits; creating more keys of the same type does not add RPM or subscription quota
  - Circumventing rate limits, access controls or other security measures is prohibited, as is scraping the service without written permission
  - Account credentials, including API keys, must not be shared with third parties other than authorized employees or contractors
