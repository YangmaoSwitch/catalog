en:
  summary: Self-hosted DeepSeek V4.1 Flash used to be free and unlimited. Since 2026-11-27 the site says LLM API registration is not open, the public free-model list is empty and coin exchange is paused for lack of capacity; the API moved to ai-api.minekuai.cn.
  signup_notes: Creating an API key requires joining the official QQ group with a QQ number; one QQ number per account
  free_model_rule: Marked by the platform as a temporary test deployment that may change
  tags:
  - Free model
  - Daily credits
  quotas:
  - models: DeepSeek V4.1 Flash 1017 (unlimited lane)
    note: Uses no allowance; requests queue at peak times. On 2026-11-27 the public free-model list was empty
  - condition: Bought with coins from the daily check-in
    note: Priority lane without queueing, valid for the day; falls back to the unlimited lane when used up. Exchange paused on 2026-11-20 for lack of capacity
