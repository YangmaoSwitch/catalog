en:
  summary: Minekuai's self-hosted DeepSeek V4.1 Flash 1017 is listed at zero price in the public model list. Registering gives the free Lite tier, where calls spend a free allowance from daily check-in coins, invites and newbie tasks, and are refused once it runs out. The former unlimited lane is gone; allowance amounts are not published.
  signup_notes: Creating an API key requires joining the official QQ group with a QQ number; one QQ number per account
  free_model_rule: Marked by the platform as a temporary test deployment that may change; zero-priced models are shown as free in the model list
  tags:
  - Free model
  - Daily credits
  quotas:
  - models: DeepSeek V4.1 Flash 1017 (unlimited lane)
    note: The unlimited lane that used no allowance was removed; free model calls now spend the free allowance and are refused when it runs out
  - models: DeepSeek V4.1 Flash 1017
    condition: Bought with coins from the daily check-in
    note: Valid for the day; amount not published. The site status endpoint still carries a "exchange paused for lack of capacity" message but flags it as open
  - models: DeepSeek V4.1 Flash 1017
    condition: Inviting friends and completing newbie tasks
    note: Permanent allowance; amount not published
