en:
  summary: Model platform of the OpenCode coding agent. Several models are free for a limited time, but free models only work inside OpenCode.
  tags:
  - Limited-time free
  - OpenCode only
  quotas:
  - models: Models whose names end in Free, and Big Pickle
    note: Free for a limited time; no published total quota or end date. LongCat 2.5 Free is limited to 100 requests a day
  terms:
  - Free models can only be called from the OpenCode client; other clients can only use paid models or the Go subscription
  - During their free period, data sent to Big Pickle, Iceman Free, Inkling 2 Small Free and Flint 40B Free may be retained and used to improve or train the models
  - Beam Free is not available in China (including Hong Kong and Macau) and some other regions
