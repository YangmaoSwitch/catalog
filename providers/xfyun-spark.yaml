en:
  summary: The lightweight Spark Lite model can be used for free through the OpenAI-compatible HTTP API; on the Astron MaaS platform Spark-X2.5-1.7B is free and Spark-X2.6-4B is free for a limited time, and registered users get a free 1B-token Spark-X2.6 allowance.
  signup_notes: Claim the free allowance on the product page, then get the APIPassword for that model version in the console; the Spark-X2.6 sign-up gift is claimed on the MaaS platform
  tags:
  - Free model
  - New-user gift
  - Limited-time free
  quotas:
  - note: The docs state Lite can be used for free; concurrency and daily limits are not stated, and requests over the limit return an error code
  - note: The iFlytek Open Platform promotion page lists a 1B-token Spark X2.6 allowance on MaaS as a sign-up gift; it is claimed in the Astron MaaS console and used through the MaaS platform rather than the spark-api-open endpoint; validity and end date not stated, eligibility subject to the console
  - note: The product page lists Spark-X2.6-4B as free for a limited time, used through the Astron MaaS platform rather than the spark-api-open endpoint; end date and usage limits not stated
  - note: The product page lists Spark-X2.5-1.7B as free, used through the Astron MaaS platform rather than the spark-api-open endpoint; usage limits not stated
