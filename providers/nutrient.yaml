en:
  summary: Nutrient, a document-processing platform, offers an OpenAI-compatible AI Gateway; the free plan includes $5 of usage per month, shared with other Nutrient APIs, no credit card needed; without a wallet, requests pause once it is used up.
  signup_notes: The free plan needs no credit card; going past the free usage requires a prepaid wallet (first top-up $25).
  tags:
  - Monthly credits
  quotas:
  - models: AI Gateway models such as nutrient-s, nutrient-m, nutrient-l, billed per token
    note: The $5 is shared across all Nutrient APIs (Data Extraction, Processor, Viewer, AI Gateway, etc.); unused usage expires each period; commercial use is limited without a wallet.
  terms:
  - After the monthly usage is used up, requests pause until the next reset unless a wallet is set up
  - Limited commercial use on the free plan without a wallet
  - OpenAI-backed requests may be processed globally and retained up to 30 days for abuse monitoring; Zero Data Retention is not currently available
