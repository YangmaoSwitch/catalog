id: dxnt
name: DX TOKEN
name_zh: 地心网络
homepage: https://www.dxnt.com
region: cn
api_usable: true
status: unconfirmed
last_verified: '2026-11-28'
summary: 国内 API 中转平台，注册送 10 元体验金，但 2026-11-27 免费路由页显示“暂未配置可使用体验金的模型”，目前用不上；关于页另写注册送 100 万 token，两处说法不一致。
api:
  protocol:
  - openai
  - anthropic
  base_url: https://www.dxnt.com/v1
  anthropic_base_url: https://www.dxnt.com
  models_access: paid
signup:
  url: https://www.dxnt.com/auth/login
  requires:
  - phone_cn
  notes: 登录页只提供微信扫码（关注公众号自动注册）和手机号登录两种方式。
quotas:
- unit: cny
  amount: 10
  period: one-time
  scope: account
  models: 免费路由页列出的模型（2026-11-27 列表为空）
  condition: 新注册账号
  note: 体验金入口随机调用可用模型，列表内模型按原价优先扣体验金，不足部分扣主余额；其他模型只用主余额。2026-11-27 页面显示“暂未配置可使用体验金的模型”。官方未写明有效期
  evidence: https://www.dxnt.com/free
  quote: 注册即送 10 元体验金，体验金入口随机调用可用模型，按量计费畅用主流大模型 API。
- unit: tokens
  amount: 1000000
  period: one-time
  scope: account
  condition: 新注册账号
  note: 关于页常见问题写“注册送 100 万 token 免费额度，无需信用卡”，与免费路由页的 10 元说法不一致，以实际到账为准
  evidence: https://www.dxnt.com/about
  quote: 注册即送 1M Tokens 免费额度，支持 GPT-3.5 和 Claude Haiku 等基础模型。
overage: manual
expires: null
onboarding:
  level: L2
  key_pattern: ^sk-at-
terms:
- point: 余额不足时接口返回 402 insufficient_quota，需在控制台充值
  url: https://www.dxnt.com/docs
- point: 页脚“服务条款”“隐私政策”链接都指向关于页，未找到单独的条款正文
  url: https://www.dxnt.com/about
tags:
- 新人
- 聚合
sources:
- https://www.dxnt.com/free
- https://www.dxnt.com/about
- https://www.dxnt.com/docs
- https://www.dxnt.com/pricing
- https://www.dxnt.com/auth/login
en:
  summary: Chinese API relay platform. Signup gives CNY 10 of trial credit, but on 2026-11-27 the free-route page said no model is set up to use it, so it cannot be spent for now; the about page separately says 1M free tokens on signup, which disagrees.
  signup_notes: The login page only offers WeChat QR login (following the official account registers you) and phone-number login.
  tags:
  - New users
  - Aggregator
  quotas:
  - models: Models listed on the free-route page (the list was empty on 2026-11-27)
    condition: New accounts
    note: The trial-credit route picks an available model at random; listed models draw on the credit first at list price, then the main balance; other models use only the main balance. On 2026-11-27 the page said no model is set up to use the credit. No expiry is stated
  - condition: New accounts
    note: The about page FAQ says signup gives 1M free tokens with no credit card, which disagrees with the CNY 10 on the free-route page; check what is actually credited
  terms:
  - When the balance runs out the API returns 402 insufficient_quota and you top up in the console
  - The footer Terms of Service and Privacy Policy links both point to the about page; no separate terms text was found
