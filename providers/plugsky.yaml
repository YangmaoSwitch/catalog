en:
  summary: OpenAI-compatible API platform; the Free plan needs no card and covers plugsky-micro and plugsky-lite, with about 100 requests and 50,000 tokens per day for new accounts, metered in a rolling 5-hour window.
  signup_notes: The Free plan needs no credit card per the official pages; what sign-up requires is not stated.
  tags:
  - Free forever
  - Free model
  - Daily credits
  quotas:
  - models: plugsky-micro and plugsky-lite combined
    condition: Accounts created on or after 2 November 2026
    note: Metered per rolling 5-hour window, about 21 requests per window; 100/day is a reference figure. Also 1 concurrent request, 30 RPM, 32K input / 2K output per request. The terms say new accounts get 100/day only for the first 24 hours and 500/day after; this conflicts with the pricing page, so the lower pricing-page figure is used.
  - models: plugsky-micro and plugsky-lite combined
    condition: Accounts created on or after 2 November 2026
    note: Metered per rolling 5-hour window, about 10,400 tokens per window; 50,000/day is a reference figure.
  - models: plugsky-micro and plugsky-lite
    condition: Free plan
  terms:
  - Multiple accounts, key sharing, resale or high-volume automated workloads may be throttled or suspended (3.1)
  - Requests are routed to third-party model providers (e.g. opencode.ai, NVIDIA NIM), whose terms also apply (7)
  - OpenAI, Anthropic and other model names are compatibility aliases served by Plugsky's own models, not the original vendors
  - The Free plan has no SLA, best effort only (8)
