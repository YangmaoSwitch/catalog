id: axforge
name: AxForge
homepage: https://axforge.ai
region: global
api_usable: true
status: verified
last_verified: '2026-11-22'
summary: 欧盟自建 GPU 的模型推理服务，新账号每 30 天赠送 300 万 token，无需信用卡。
api:
  protocol:
  - openai
  base_url: https://api.axforge.ai/v1
  models_access: quota
  models:
  - qwen3.8-27b
  - qwen3.8-flash-next
  - glm-5.3-flash
  - mimo-v2.6-flash
signup:
  url: https://console.axforge.ai/keys
  requires:
  - email
  notes: 在控制台注册后自动生成 API Key，Key 绑定斯德哥尔摩区域；免费额度无需信用卡，充值通过 Stripe 刷卡。
quotas:
- unit: tokens
  amount: 3000000
  period: month
  scope: account
  models: 全部 serverless 模型
  condition: 新账号；同一网络 30 天内只有第一个账号能拿到
  note: 每 30 天发放一次；属于上线优惠，调整会在价格页提前公告；每账号最多 8 个并发请求
  evidence: https://axforge.ai/pricing/
overage: blocked
expires: null
onboarding:
  level: L2
  key_page: https://console.axforge.ai/keys
terms:
- point: 免费 token 按网络发放，30 天内已有账号登录过的网络再注册新账号拿不到
  url: https://axforge.ai/terms.html
- point: API Key 归本人所有，不得分享、公开或转售
  url: https://axforge.ai/terms.html
- point: 余额和免费额度用完后请求被拒（402），不会自动扣费
  url: https://axforge.ai/terms.html
- point: 提示词和输出不写盘、不记日志、不用于训练
  url: https://axforge.ai/terms.html
tags:
- 每月赠送
sources:
- https://axforge.ai/
- https://axforge.ai/pricing/
- https://dev.axforge.ai/docs/quickstart/
- https://dev.axforge.ai/docs/chat/
- https://dev.axforge.ai/docs/errors-limits/
- https://axforge.ai/terms.html
en:
  summary: EU inference service on its own GPUs. New accounts get 3M free tokens every 30 days; no credit card needed.
  signup_notes: An API key is created when you sign up in the console and is pinned to the Stockholm region. The free allowance needs no card; top-ups are paid by card through Stripe.
  tags:
  - Monthly credits
  quotas:
  - models: All serverless models
    condition: New accounts; only the first account from a network within 30 days receives it
    note: Granted every 30 days; it is a launch offer and changes are announced on the pricing page; up to 8 concurrent calls per account
  terms:
  - Free tokens are granted per network; a new account from a network where an account signed in within the last 30 days gets none
  - API keys are personal and must not be shared, published or resold
  - Requests are declined (402) once the allowance and balance are used up; no automatic charge
  - Prompts and completions are not written to disk or logs and are not used for training
