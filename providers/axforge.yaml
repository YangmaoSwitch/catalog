id: axforge
name: AxForge
homepage: https://axforge.ai
region: global
api_usable: true
status: verified
last_verified: '2026-11-27'
summary: 欧盟自建 GPU 的模型推理服务，新账号每 30 天赠送 300 万 token，需先验卡解锁（不扣费）。
api:
  protocol:
  - openai
  base_url: https://api.axforge.ai/v1
  models_access: quota
  models:
  - qwen3.8-27b
  - qwen3.8-flash-next
  - glm-5.3-flash
  - mimo-v2.6-flash
signup:
  url: https://console.axforge.ai/keys
  requires:
  - email
  - card
  notes: 在控制台注册后自动生成 API Key，Key 绑定斯德哥尔摩区域；免费额度要先在 Stripe 页面验卡解锁，不扣费，每张卡 12 个月内只能解锁一次，预付卡不行；充值也通过 Stripe 刷卡。
quotas:
- unit: tokens
  amount: 3000000
  period: month
  scope: account
  models: 全部 serverless 模型
  condition: 新账号，验卡后解锁；每张卡 12 个月内只能解锁一次，预付卡不行
  note: 每 30 天发放一次；属于上线优惠，调整会在价格页提前公告；免费账号最多 2 个并发请求，每个对话模型上所有免费账号共用 8 个并发席位，忙时直接返回 429
  evidence: https://axforge.ai/pricing/
  quote: Every new account includes 3M free serverless tokens every 30 days, after a card check (nothing charged).
overage: blocked
expires: null
onboarding:
  level: L2
  key_page: https://console.axforge.ai/keys
terms:
- point: 免费 token 需在 Stripe 验卡解锁（不扣费），每张卡 12 个月内只能解锁一次，预付卡不能解锁
  url: https://axforge.ai/terms.html
- point: API Key 归本人所有，不得分享、公开或转售
  url: https://axforge.ai/terms.html
- point: 余额和免费额度用完后请求被拒（402），不会自动扣费
  url: https://axforge.ai/terms.html
- point: 提示词和输出不写盘、不记日志、不用于训练
  url: https://axforge.ai/terms.html
tags:
- 每月赠送
sources:
- https://axforge.ai/
- https://axforge.ai/pricing/
- https://dev.axforge.ai/docs/quickstart/
- https://dev.axforge.ai/docs/chat/
- https://dev.axforge.ai/docs/errors-limits/
- https://axforge.ai/terms.html
en:
  summary: EU inference service on its own GPUs. New accounts get 3M free tokens every 30 days after a card check (nothing charged).
  signup_notes: An API key is created when you sign up in the console and is pinned to the Stockholm region. The free allowance is unlocked by a card check on Stripe (nothing charged); each card unlocks it once in 12 months and prepaid cards cannot. Top-ups are paid by card through Stripe.
  tags:
  - Monthly credits
  quotas:
  - models: All serverless models
    condition: New accounts, after a card check; each card unlocks it once in 12 months, prepaid cards cannot
    note: Granted every 30 days; it is a launch offer and changes are announced on the pricing page; a free account runs 2 calls at once, and all free accounts share 8 seats per chat model, so busy models return 429 at once
  terms:
  - Free tokens are unlocked by a card check on Stripe (nothing charged); each card unlocks them once in 12 months, and prepaid cards cannot
  - API keys are personal and must not be shared, published or resold
  - Requests are declined (402) once the allowance and balance are used up; no automatic charge
  - Prompts and completions are not written to disk or logs and are not used for training
