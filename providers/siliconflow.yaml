en:
  summary: Some models are free long-term (rate-limited per model); real-name verification earns a 16 CNY voucher, and inviting a friend who verifies gives both sides 16 CNY (campaign until 2026-12-31).
  tags:
  - Always free
  - New users
  quotas:
  - models: Models marked “free” on the pricing page
    note: Rate-limited per model
  - condition: Real-name verification
    note: Offer ends 2026-12-31; voucher valid 180 days from receipt, usable platform-wide (including Pro models)
  - condition: Invite a friend who signs up and completes real-name verification (per invitee)
    note: Inviter and invitee each get a 16 CNY voucher, no cap on invites during the campaign; ends 2026-12-31
  terms:
  - Users may authorize third parties to store access tokens and credentials (1.1.3)
