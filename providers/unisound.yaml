en:
  summary: Unisound MaaS offers a Free tier of its U Plan subscription that can be claimed at no cost; the quota and period are not published on the official pages. Pay-as-you-go models are paid.
  signup_notes: Sign in with an SMS code (first sign-in creates the account); individual or company developer real-name verification is required. U Plan uses a dedicated plan key (tp- prefix) that is not interchangeable with pay-as-you-go keys and only works while the plan is valid.
  tags:
  - Trial
  quotas:
  - models: Models in the U Plan (the notice mentions U2-Flash and U2-Med)
    condition: Claim the U Plan Free tier
    note: The official pages do not state the Free tier's amount, unit or period; the monthly period is a placeholder based on the paid U Plan tiers being priced per month, pending confirmation.
  terms:
  - One dedicated U Plan key per account, only for plan quota, unusable after the plan expires
  - Rate limits apply, e.g. u2-flash at 100 requests and 10,000,000 tokens per minute
