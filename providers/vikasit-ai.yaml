en:
  summary: OpenAI-compatible inference API from India's Chandorkar Technologies; after GitHub sign-in, vikasit-nova is free at 2M tokens per account per day with no card required; other models are pay-as-you-go.
  signup_notes: Sign in with GitHub to get an API key; the free allowance needs no credit card.
  tags:
  - Free model
  - Daily allowance
  quotas:
  - models: vikasit-nova
    condition: Signed-in developer accounts
    note: The provider says the free daily allowance may change, fair-use limits apply per account, and the free tier may be adjusted or retired at any time; reset time not published.
  terms:
  - Circumventing usage limits, billing, rate limits or security controls is prohibited (section 3)
  - Reselling or sublicensing the service is prohibited unless expressly permitted (section 3)
  - The free allowance may change, fair-use limits apply per account, and the free tier may be adjusted or retired at any time
  - Content sent to paid Vikasit models is not used for training; third-party operators of Free Preview models in the CLI may train on request content
