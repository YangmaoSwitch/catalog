en:
  summary: Multi-model aggregator gateway; the model page lists deepseek/deepseek-v4.1-flash-1017-free as free ($0 input and output), with no published request limit; other models are pay-as-you-go.
  signup_notes: Sign up with email and create an API key in the console; usage is deducted from a prepaid balance.
  tags:
  - Aggregator
  - Free model
  quotas:
  - models: deepseek/deepseek-v4.1-flash-1017-free
    note: The model page prices input and output at $0.0000 and labels it Free Self-hosted Inference; no request or token limit is published. Concurrency is tiered by real-time balance and the lowest listed tier is a balance above $0; whether zero-balance accounts can call it is not stated.
  - models: z-ai/glm-5.3
    note: GLM 5.3 was free for all accounts during its first week (through September 4); the promotion has ended and standard pricing applies.
  terms:
  - Maximum concurrent requests per account are tiered by real-time balance; over $0 up to $10 allows 5; excess requests may be queued, throttled or rejected
  - When requests go to third-party model providers, their terms govern data handling; the platform says it does not store prompts or completions
